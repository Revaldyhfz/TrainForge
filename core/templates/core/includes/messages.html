{% if messages %}
  <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
    {% for message in messages %}
      <div class="bg-white border border-gray-200 rounded-md shadow-sm px-4 py-3 text-sm min-w-[240px] max-w-sm
                  {% if message.tags == 'error' %}border-red-200 text-red-700{% endif %}
                  {% if message.tags == 'success' %}border-[#2D6A4F] text-[#2D6A4F]{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
