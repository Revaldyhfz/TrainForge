{# Sidebar nav for trainer pages. Pass `active` to highlight current page. #}
<aside id="sidebar"
       class="w-56 bg-[#F0FDF4] border-r border-[#D8F3DC] fixed h-full p-4 flex flex-col z-30
              transition-transform -translate-x-full md:translate-x-0">
  <a href="{% url 'dashboard' %}" class="text-base font-semibold mb-8 px-3 text-[#2D6A4F]">
    TrainForge
  </a>

  <nav class="flex flex-col gap-1 flex-1">
    <a href="{% url 'dashboard' %}"
       class="text-sm px-3 py-2 rounded-md transition-colors {% if active == 'dashboard' %}bg-[#2D6A4F] text-white{% else %}text-gray-600 hover:bg-white{% endif %}">
      Dashboard
    </a>
    <a href="{% url 'clients_list' %}"
       class="text-sm px-3 py-2 rounded-md transition-colors {% if active == 'clients' %}bg-[#2D6A4F] text-white{% else %}text-gray-600 hover:bg-white{% endif %}">
      Clients
    </a>
    <a href="{% url 'plans_list' %}"
       class="text-sm px-3 py-2 rounded-md transition-colors {% if active == 'plans' %}bg-[#2D6A4F] text-white{% else %}text-gray-600 hover:bg-white{% endif %}">
      Training Plans
    </a>
    <a href="{% url 'appointments_list' %}"
       class="text-sm px-3 py-2 rounded-md transition-colors {% if active == 'appointments' %}bg-[#2D6A4F] text-white{% else %}text-gray-600 hover:bg-white{% endif %}">
      Appointments
    </a>
    <a href="{% url 'progress_list' %}"
       class="text-sm px-3 py-2 rounded-md transition-colors {% if active == 'progress' %}bg-[#2D6A4F] text-white{% else %}text-gray-600 hover:bg-white{% endif %}">
      Progress
    </a>
  </nav>
</aside>
