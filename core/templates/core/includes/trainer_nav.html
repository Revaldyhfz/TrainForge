{# Sidebar nav for trainer pages. Pass `active` to highlight current page. #}
<aside class="w-56 bg-white border-r border-gray-200 fixed h-full p-4 flex flex-col">
  <a href="{% url 'dashboard' %}" class="text-base font-semibold mb-8">TrainForge</a>

  <nav class="flex flex-col gap-1 flex-1">
    <a href="{% url 'dashboard' %}"
       class="text-sm px-3 py-2 rounded-md {% if active == 'dashboard' %}bg-[#D8F3DC] text-[#2D6A4F]{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
      Dashboard
    </a>
    <a href="{% url 'clients_list' %}"
       class="text-sm px-3 py-2 rounded-md {% if active == 'clients' %}bg-[#D8F3DC] text-[#2D6A4F]{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
      Clients
    </a>
    <a href="{% url 'plans_list' %}"
       class="text-sm px-3 py-2 rounded-md {% if active == 'plans' %}bg-[#D8F3DC] text-[#2D6A4F]{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
      Training Plans
    </a>
    <a href="{% url 'appointments_list' %}"
       class="text-sm px-3 py-2 rounded-md {% if active == 'appointments' %}bg-[#D8F3DC] text-[#2D6A4F]{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
      Appointments
    </a>
    <a href="{% url 'progress_list' %}"
       class="text-sm px-3 py-2 rounded-md {% if active == 'progress' %}bg-[#D8F3DC] text-[#2D6A4F]{% else %}text-gray-500 hover:bg-gray-50{% endif %}">
      Progress
    </a>
  </nav>

  

  <div class="border-t border-gray-100 pt-4">
    <p class="text-xs text-gray-500 px-3 mb-2">{{ user.username }}</p>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="text-sm text-red-500 px-3 py-1.5 hover:bg-red-50 rounded-md w-full text-left">
        Logout
      </button>
    </form>
  </div>
</aside>
