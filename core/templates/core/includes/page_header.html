{# Page title block. Pass: title, subtitle, action_url, action_label (last two optional). #}
<div class="flex items-center justify-between mb-8">
  <div>
    <h1 class="serif text-2xl md:text-3xl mb-1">{{ title }}</h1>
    {% if subtitle %}<p class="text-sm text-gray-500">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_url and action_label %}
    <a href="{{ action_url }}" class="bg-[#2D6A4F] text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-[#245840]">
      {{ action_label }}
    </a>
  {% endif %}
</div>
