{% extends 'core/trainer_base.html' %}
{% block title %}{{ form_title }} — TrainForge{% endblock %}

{% block trainer_content %}
{% include 'core/includes/page_header.html' with title=form_title %}

<div class="max-w-2xl bg-white border border-gray-200 rounded-xl p-8">
  <form method="post" class="space-y-4" id="appointment-form">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium mb-1">Client</label>
      <select name="client_id" required
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
        <option value="">Select a client</option>
        {% for c in clients %}
          <option value="{{ c.id }}" {% if values.client_id|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>
            {{ c.name }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-sm font-medium mb-1">Date</label>
        <input type="date" name="scheduled_date" value="{{ values.scheduled_date|default:'' }}" required
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Time</label>
        <input type="time" name="scheduled_time" value="{{ values.scheduled_time|default:'' }}" required
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Duration (minutes)</label>
      <input type="number" name="duration_minutes" min="15" step="15" value="{{ values.duration_minutes|default:60 }}"
             class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Notes</label>
      <textarea name="notes" rows="3"
                class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">{{ values.notes|default:'' }}</textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" id="appointment-submit-btn"
              class="bg-[#2D6A4F] text-white px-5 py-2 rounded-md text-sm font-medium hover:bg-[#245840] disabled:opacity-50">
        {{ submit_label }}
      </button>
      <a href="{% url 'appointments_list' %}" class="border border-gray-200 px-5 py-2 rounded-md text-sm font-medium hover:bg-gray-50">
        Cancel
      </a>
    </div>
  </form>
</div>

<script>
  // Show 'Booking...' indicator while the form submits and email sends.
  const apptForm = document.getElementById('appointment-form');
  const apptBtn = document.getElementById('appointment-submit-btn');
  apptForm.addEventListener('submit', () => {
    apptBtn.disabled = true;
    apptBtn.textContent = 'Sending email...';
  });
</script>

{% endblock %}
