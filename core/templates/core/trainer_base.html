{% extends 'core/base.html' %}

{% block content %}
{% include 'core/includes/trainer_nav.html' with active=active_nav %}

<button onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full')"
        class="md:hidden fixed top-4 left-4 z-40 bg-white border border-gray-200 p-2 rounded-md hover:bg-gray-50"
        aria-label="Toggle navigation">
  <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
</svg>
</button>

<div class="md:ml-56 flex flex-col min-h-screen">
  {% include 'core/includes/trainer_header.html' %}
  <main id="main-content" class="flex-1 p-4 md:p-8">
    {% block trainer_content %}{% endblock %}
  </main>
  {% include 'core/includes/trainer_footer.html' %}
</div>
{% endblock %}
