{% extends 'core/trainer_base.html' %}
{% block title %}{{ form_title }} — TrainForge{% endblock %}

{% block trainer_content %}
{% include 'core/includes/page_header.html' with title=form_title subtitle=plan.title %}

<div class="max-w-2xl bg-white border border-gray-200 rounded-xl p-8">
  <form method="post" class="space-y-4">
    {% csrf_token %}

    <div>
      <label for="id_name" class="block text-sm font-medium mb-1">Exercise Name</label>
      <input type="text" name="name" id="id_name" value="{{ values.name|default:'' }}" required
             class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
    </div>

    <div>
      <label for="exercise-type" class="block text-sm font-medium mb-1">Type</label>
      <select name="exercise_type" id="exercise-type" required
              class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
        <option value="reps" {% if values.exercise_type == 'reps' or not values.exercise_type %}selected{% endif %}>
          Reps-based (sets × reps)
        </option>
        <option value="duration" {% if values.exercise_type == 'duration' %}selected{% endif %}>
          Duration-based (sets × minutes)
        </option>
        <option value="distance" {% if values.exercise_type == 'distance' %}selected{% endif %}>
          Distance-based (km)
        </option>
      </select>
    </div>

    <div>
      <label for="id_description" class="block text-sm font-medium mb-1">Description</label>
      <textarea name="description" id="id_description" rows="2"
                class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">{{ values.description|default:'' }}</textarea>
    </div>

    <div id="fields-reps" class="grid grid-cols-2 gap-3 type-fields">
      <div>
        <label for="id_sets" class="block text-sm font-medium mb-1">Sets</label>
        <input type="number" name="sets" id="id_sets" min="1" placeholder="e.g. 3" value="{{ values.sets|default:'' }}"
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
      <div>
        <label for="id_reps" class="block text-sm font-medium mb-1">Reps</label>
        <input type="number" name="reps" id="id_reps" min="1" placeholder="e.g. 10" value="{{ values.reps|default:'' }}"
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
    </div>

    <div id="fields-duration" class="grid grid-cols-2 gap-3 type-fields hidden">
      <div>
        <label for="id_sets_duration" class="block text-sm font-medium mb-1">Sets</label>
        <input type="number" name="sets_duration" id="id_sets_duration" min="1" placeholder="e.g. 3" value="{{ values.sets|default:'' }}"
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
      <div>
        <label for="id_duration_minutes" class="block text-sm font-medium mb-1">Duration (minutes)</label>
        <input type="number" name="duration_minutes" id="id_duration_minutes" min="1" placeholder="e.g. 5" value="{{ values.duration_minutes|default:'' }}"
               class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
      </div>
    </div>

    <div id="fields-distance" class="type-fields hidden">
      <label for="id_distance_km" class="block text-sm font-medium mb-1">Distance (km)</label>
      <input type="number" step="0.1" name="distance_km" id="id_distance_km" min="0" placeholder="e.g. 5" value="{{ values.distance_km|default:'' }}"
             class="w-full border border-gray-200 rounded-md px-3 py-2 text-sm focus:outline-none focus:border-[#2D6A4F]">
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-[#2D6A4F] text-white px-5 py-2 rounded-md text-sm font-medium hover:bg-[#245840]">
        {{ submit_label }}
      </button>
      <a href="{% url 'plan_edit' plan.id %}" class="border border-gray-200 px-5 py-2 rounded-md text-sm font-medium hover:bg-gray-50">
        Cancel
      </a>
    </div>
  </form>
</div>

<script>
  // Show only the field group matching the selected exercise type.
  const typeSelect = document.getElementById('exercise-type');
  const fieldGroups = {
    reps: document.getElementById('fields-reps'),
    duration: document.getElementById('fields-duration'),
    distance: document.getElementById('fields-distance'),
  };

  function updateFields() {
    Object.entries(fieldGroups).forEach(([type, el]) => {
      if (!el) return;
      if (type === typeSelect.value) {
        el.classList.remove('hidden');
      } else {
        el.classList.add('hidden');
      }
    });
  }

  if (typeSelect) {
    typeSelect.addEventListener('change', updateFields);
    updateFields();
  }
</script>
{% endblock %}
